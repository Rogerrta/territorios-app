<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Controle de Territórios</title>

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >
</head>

<body>

  <header class="topbar">

    <div>
      <p class="eyebrow">
        Gestão de territórios
      </p>

      <h1>
        Controle de Territórios
      </h1>
    </div>

    <button
      class="btn-primary"
      id="newMovementBtn"
      type="button"
    >
      + Nova movimentação
    </button>

  </header>


  <main class="container">

    <!-- =========================
         RESUMO
    ========================== -->

    <section class="summary-grid">

      <article class="summary-card">

        <span class="summary-label">
          Total
        </span>

        <strong
          class="summary-number"
          id="totalTerritorios"
        >
          0
        </strong>

        <span class="summary-text">
          territórios cadastrados
        </span>

      </article>


      <article class="summary-card">

        <span class="summary-label">
          Disponíveis
        </span>

        <strong
          class="summary-number"
          id="totalDisponiveis"
        >
          0
        </strong>

        <span class="summary-text">
          prontos para designação
        </span>

      </article>


      <article class="summary-card">

        <span class="summary-label">
          Em uso
        </span>

        <strong
          class="summary-number"
          id="totalEmUso"
        >
          0
        </strong>

        <span class="summary-text">
          territórios designados
        </span>

      </article>


      <article class="summary-card attention">

        <span class="summary-label">
          Atenção
        </span>

        <strong
          class="summary-number"
          id="totalAtencao"
        >
          0
        </strong>

        <span class="summary-text">
          há mais tempo em uso
        </span>

      </article>

    </section>


    <!-- =========================
         TERRITÓRIOS
    ========================== -->

    <section class="territories-section">

      <div class="section-header">

        <div>

          <p class="eyebrow">
            Visão geral
          </p>

          <h2>
            Territórios
          </h2>

        </div>


        <div class="filters">

          <input
            type="search"
            id="search"
            placeholder="Buscar território..."
            autocomplete="off"
          >


          <select id="statusFilter">

            <option value="todos">
              Todos
            </option>

            <option value="disponivel">
              Disponíveis
            </option>

            <option value="uso">
              Em uso
            </option>

            <option value="atencao">
              Atenção
            </option>

          </select>

        </div>

      </div>


      <div
        class="territories-grid"
        id="territoriesGrid"
      ></div>

    </section>

  </main>


  <!-- =========================
       MODAL NOVA MOVIMENTAÇÃO
  ========================== -->

  <div
    class="movement-modal"
    id="newMovementModal"
    aria-hidden="true"
    hidden
  >

    <div
      class="movement-modal-overlay"
      id="newMovementOverlay"
    ></div>


    <section
      class="movement-modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="newMovementTitle"
    >

      <div class="movement-modal-header">

        <div>

          <p class="eyebrow">
            Designação
          </p>

          <h2 id="newMovementTitle">
            Nova movimentação
          </h2>

        </div>


        <button
          type="button"
          class="movement-modal-close"
          id="newMovementClose"
          aria-label="Fechar"
        >
          ×
        </button>

      </div>


      <form id="newMovementForm">

        <div class="form-group">

          <label for="movementTerritory">
            Território
          </label>

          <select
            id="movementTerritory"
            required
          >

            <option value="">
              Selecione um território
            </option>

          </select>

        </div>


        <div class="form-group">

          <label for="movementResponsible">
            Designado para
          </label>

          <input
            type="text"
            id="movementResponsible"
            placeholder="Nome do responsável"
            autocomplete="off"
            required
          >

        </div>


        <div class="form-group">

          <label for="movementDate">
            Data da designação
          </label>

          <input
            type="date"
            id="movementDate"
            required
          >

        </div>


        <div class="movement-modal-actions">

          <button
            type="button"
            class="btn-cancel"
            id="newMovementCancel"
          >
            Cancelar
          </button>


          <button
            type="submit"
            class="btn-primary"
          >
            Confirmar designação
          </button>

        </div>

      </form>

    </section>

  </div>


  <script src="assets/js/app.js"></script>

</body>

</html>
